description:
  de: |-
    Midnight Havana wird für eine Nacht ein kleines Stück Havanna: Salsa, Son und genau die Eleganz, bei der sogar der Holzboden etwas gerader steht. Kurse ab 19 Uhr, Social Dance ab 21 Uhr und DJ Helen sorgt dafür, dass Berlin kurz vergisst, dass draußen Herbst ist.
  en: |-
    For one night, Midnight Havana turns into a small piece of Havana: salsa, son and just enough elegance to make even the wooden floor stand a little taller. Classes from 19:00, social dance from 21:00, and DJ Helen makes Berlin forget that autumn is waiting outside.
