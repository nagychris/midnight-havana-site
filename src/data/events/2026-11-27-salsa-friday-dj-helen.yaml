description:
  de: |-
    Freut euch auf einen Abend mit Cuban Salsa, Timba, Son und viel Gefühl für Musikalität.

    Bevor die Party startet, gibt es wie gewohnt unsere Salsa Cubana und Rueda de Casino Kurse in verschiedenen Levels. Danach öffnet sich ab 21:00 Uhr die Tanzfläche für den Social Dance.

    Ein Freitag für alle, die Salsa lernen, ihre Skills verbessern oder einfach einen warmen Abend mit unserer Community verbringen möchten.

    Come to learn. Stay to dance.
  en: |-
    Look forward to a night of Cuban salsa, timba, son and a real feel for musicality.

    Before the party starts, our Cuban salsa and Rueda de Casino classes run as usual, at different levels. From 21:00 the dance floor opens for the social dance.

    A Friday for everyone who wants to learn salsa, improve their skills or simply spend a warm evening with our community.

    Come to learn. Stay to dance.
